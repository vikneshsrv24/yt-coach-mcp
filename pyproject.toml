[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-coach-mcp"
version = "0.1.0"
description = "Personal vidIQ-style YouTube coach as an MCP server"
requires-python = ">=3.10"
dependencies = ["mcp>=1.9,<2", "httpx>=0.27", "youtube-transcript-api>=1.0", "python-dotenv>=1.0"]

[project.scripts]
yt-coach = "yt_coach.server:main"

[tool.setuptools]
packages = ["yt_coach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
